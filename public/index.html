<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share My Food</title>
    <script src="config.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #FFDAB9; 
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
        }

        select, button {
            margin: 10px 0;
            padding: 8px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        select:hover, button:hover {
            background-color: #45a049;
        }

        .foodBankBlock {
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 250px;
            text-align: center;
            background-color: #fff;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .foodBankBlock:hover {
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
        }

        .foodBankBlock img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        .foodBankBlock h3 {
            color: #4CAF50;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .foodBankBlock p {
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .avatar {
            display: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="header">
    <h1>Share My Food - Food Banks</h1>
    <div class="header-buttons">
        <button id="donorBtn" onclick="window.location.href='donor_form.html'">User Registration</button>
        <button id="recipientBtn" onclick="window.location.href='recipient.html'">Requirement submission</button>
        <img id="avatar" class="avatar" src="" alt="User Avatar"  onclick="window.location.href='account-settings.html'">
    </div>
  </div>
    <label for="location">Select Location:</label>
    <select id="location" onchange="updateImage()">
        <option value="Calgary">Calgary</option>
        <option value="Edmonton">Edmonton</option>
        <option value="Toronto">Toronto</option>
    </select>
    <button onclick="fetchFoodBanks()">Get Food Banks</button>
    <div id="foodBanksContainer"></div>

    <script>
        function updateUI() {
            const avatarUrl = `${window.env.AZURE_STORAGE_URL}/avatar.png?${window.env.AZURE_SAS_TOKEN}`
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

            if (isLoggedIn) {
                console.log(isLoggedIn);
                document.getElementById('donorBtn').style.display = 'none';
                document.getElementById('recipientBtn').style.display = 'none';
                document.getElementById('avatar').style.display = 'block';
                document.getElementById('avatar').src = avatarUrl;
            } else {
                document.getElementById('donorBtn').style.display = 'block';
                document.getElementById('recipientBtn').style.display = 'block';
                document.getElementById('avatar').style.display = 'none';
            }
        }

        window.onload = updateUI;
        function updateImage() {
            const location = document.getElementById('location').value;
            const image = document.getElementById('foodBankImage');
            // Change image source based on selected location
                image.src = `${bankImageUrl}`;
        }

        async function fetchFoodBanks() {
            const container = document.getElementById('foodBanksContainer');
            container.innerHTML = ''; // Clear previous content

            const location = document.getElementById('location').value;

            try {
                const response = await fetch(`https://${process.env.APIURL}/food-banks?location=`+location); // Replace with your API endpoint
                const foodBanks = await response.json();

                foodBanks.forEach(bank => {
                    if (bank.name.includes(location)) {
                        const block = document.createElement('div');
                        block.classList.add('foodBankBlock');
                        const imageUrl = `${window.env.AZURE_STORAGE_URL}/${bank.image}?${window.env.AZURE_SAS_TOKEN}`;
                        block.innerHTML = `
                            <img src="${imageUrl}" alt="${bank.name}">
                            <h3>${bank.name}</h3>
                            <p><strong>Location:</strong> ${bank.address}</p>
                        `;
                        container.appendChild(block);
                    }
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                alert('Error fetching food banks data.');
            }
        }
    </script>
</body>
</html>
